<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname;
        const appStoreURL = 'https://apps.apple.com/app/id6758742993';

        if (path.startsWith('/invite/')) {
            const inviteId = path.split('/invite/')[1];
            // Try custom scheme first
            window.location.href = 'bluewayve://invite/' + inviteId;
            setTimeout(() => {
                window.location.href = appStoreURL;
            }, 2500);
        } else if (path.startsWith('/app/invite')) {
            const params = window.location.search;
            window.location.href = 'bluewayve://app/invite' + params;
            setTimeout(() => {
                window.location.href = appStoreURL;
            }, 2500);
        } else {
            window.location.href = '/';
        }
    </script>
    <title>BlueWayve</title>
</head>
<body>
    <p>Opening BlueWayve...</p>
</body>
</html>
